<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PAPAPET Rações — Cadastro</title>
  <meta name="description" content="Cadastre-se na PAPAPET Rações e fale conosco pelo WhatsApp." />

  <!-- ==================== CSS (interno) ==================== -->
  <style>
    :root {
      --brand: #ff6007;
      --brand-dark: #e55506;
      --black: #1a1a1a;
      --white: #ffffff;
      --gray-50: #fafafa;
      --gray-200: #e5e5e5;
      --gray-400: #a3a3a3;
      --gray-600: #525252;
      --error: #dc2626;
      --radius: 14px;
      --shadow: 0 16px 48px rgba(0, 0, 0, 0.12);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100dvh;
      background: var(--brand);
      color: var(--black);
      line-height: 1.5;
    }

    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: 1.25rem 1rem 2.5rem;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-wrap {
      width: 100%;
      max-width: 320px;
      margin-bottom: 0.75rem;
    }

    .logo-wrap img {
      width: 100%;
      height: auto;
      display: block;
    }

    .headline {
      text-align: center;
      color: var(--white);
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .card {
      width: 100%;
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem 1.25rem;
    }

    .card h2 {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 0.2rem;
    }

    .section-label {
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--brand);
      margin: 1.25rem 0 0.75rem;
      padding-bottom: 0.35rem;
      border-bottom: 2px solid var(--gray-200);
    }

    .section-label:first-of-type {
      margin-top: 0;
    }

    .field {
      margin-bottom: 1rem;
    }

    .field label,
    .field .label-text {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .field input[type="text"],
    .field input[type="tel"] {
      width: 100%;
      padding: 0.7rem 0.9rem;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      border: 2px solid var(--gray-200);
      border-radius: 10px;
      background: var(--gray-50);
      color: var(--black);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(255, 96, 7, 0.2);
      background: var(--white);
    }

    .field input.invalid {
      border-color: var(--error);
      background: #fef2f2;
    }

    .field .hint {
      font-size: 0.72rem;
      color: var(--gray-400);
      margin-top: 0.25rem;
    }

    .field .error-msg {
      font-size: 0.72rem;
      color: var(--error);
      font-weight: 700;
      margin-top: 0.25rem;
      display: none;
    }

    .field .error-msg.visible {
      display: block;
    }

    .choice-group {
      display: flex;
      gap: 0.5rem;
    }

    .choice-group input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .choice-group label {
      flex: 1;
      text-align: center;
      padding: 0.65rem 0.5rem;
      font-size: 0.9rem;
      font-weight: 700;
      border: 2px solid var(--gray-200);
      border-radius: 10px;
      background: var(--gray-50);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
      margin-bottom: 0;
    }

    .choice-group input:checked + label {
      border-color: var(--brand);
      background: var(--brand);
      color: var(--white);
    }

    .choice-group input:focus-visible + label {
      outline: 2px solid var(--black);
      outline-offset: 2px;
    }

    .conditional {
      display: none;
      padding: 0.75rem 0 0;
      margin-top: 0.25rem;
      border-left: 3px solid var(--brand);
      padding-left: 0.85rem;
      margin-left: 0.15rem;
    }

    .conditional.visible {
      display: block;
    }

    .conditional .field:last-child {
      margin-bottom: 0;
    }

    .consent {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      margin: 1.25rem 0;
      font-size: 0.78rem;
      color: var(--gray-600);
    }

    .consent input {
      margin-top: 0.15rem;
      width: 1rem;
      height: 1rem;
      accent-color: var(--brand);
      flex-shrink: 0;
    }

    .btn-submit {
      width: 100%;
      padding: 0.95rem 1.25rem;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--white);
      background: var(--black);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s, opacity 0.2s;
    }

    .btn-submit:hover:not(:disabled) {
      background: #333;
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .alert {
      display: none;
      margin-top: 1rem;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      text-align: center;
    }

    .alert.visible {
      display: block;
    }

    .alert.error {
      background: #fee2e2;
      color: var(--error);
    }

    .footer {
      margin-top: auto;
      padding-top: 1.5rem;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.88);
    }

    @media (min-width: 480px) {
      .page {
        padding: 2rem 1.25rem 3rem;
      }

      .card {
        padding: 1.75rem 1.5rem;
      }

      .headline {
        font-size: 2.35rem;
        margin-bottom: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="logo-wrap">
      <img src="LOGO PAPAPET .png" alt="PAPAPET Rações" width="320" height="auto" />
    </div>

    <p class="headline">Concorra</p>

    <section class="card" aria-label="Formulário de cadastro">
      <form id="lead-form" novalidate>
        <p class="section-label">Sobre você</p>

        <div class="field">
          <span class="label-text">Você já é cliente da PAPAPET?</span>
          <div class="choice-group" role="radiogroup" aria-label="Já é cliente">
            <input type="radio" name="ja_cliente" id="ja_cliente_sim" value="sim" required />
            <label for="ja_cliente_sim">Sim</label>
            <input type="radio" name="ja_cliente" id="ja_cliente_nao" value="nao" />
            <label for="ja_cliente_nao">Não</label>
          </div>
          <span class="error-msg" id="ja_cliente-error"></span>
        </div>

        <div class="field">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" autocomplete="name" required minlength="3" placeholder="Seu nome" />
          <span class="error-msg" id="nome-error"></span>
        </div>

        <div class="field">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" inputmode="numeric" required placeholder="000.000.000-00" maxlength="14" />
          <span class="error-msg" id="cpf-error"></span>
        </div>

        <div class="field">
          <label for="whatsapp">WhatsApp</label>
          <input type="tel" id="whatsapp" name="whatsapp" autocomplete="tel" required placeholder="(00) 00000-0000" maxlength="16" />
          <span class="hint">Com DDD.</span>
          <span class="error-msg" id="whatsapp-error"></span>
        </div>

        <p class="section-label">Cachorro</p>

        <div class="field">
          <span class="label-text">Você tem cachorro?</span>
          <div class="choice-group" role="radiogroup" aria-label="Tem cachorro">
            <input type="radio" name="tem_cachorro" id="tem_cachorro_sim" value="sim" required />
            <label for="tem_cachorro_sim">Sim</label>
            <input type="radio" name="tem_cachorro" id="tem_cachorro_nao" value="nao" />
            <label for="tem_cachorro_nao">Não</label>
          </div>
          <span class="error-msg" id="tem_cachorro-error"></span>
        </div>

        <div class="conditional" id="cachorro-detalhes">
          <div class="field">
            <span class="label-text">O cachorro tem mais de 1 ano?</span>
            <div class="choice-group" role="radiogroup" aria-label="Cachorro mais de 1 ano">
              <input type="radio" name="cachorro_mais_1_ano" id="cachorro_ano_sim" value="sim" />
              <label for="cachorro_ano_sim">Sim</label>
              <input type="radio" name="cachorro_mais_1_ano" id="cachorro_ano_nao" value="nao" />
              <label for="cachorro_ano_nao">Não</label>
            </div>
            <span class="error-msg" id="cachorro_mais_1_ano-error"></span>
          </div>

          <div class="field">
            <span class="label-text">É de pequeno porte?</span>
            <div class="choice-group" role="radiogroup" aria-label="Cachorro pequeno porte">
              <input type="radio" name="cachorro_pequeno_porte" id="cachorro_porte_sim" value="sim" />
              <label for="cachorro_porte_sim">Sim</label>
              <input type="radio" name="cachorro_pequeno_porte" id="cachorro_porte_nao" value="nao" />
              <label for="cachorro_porte_nao">Não</label>
            </div>
            <span class="error-msg" id="cachorro_pequeno_porte-error"></span>
          </div>
        </div>

        <p class="section-label">Gato</p>

        <div class="field">
          <span class="label-text">Você tem gato?</span>
          <div class="choice-group" role="radiogroup" aria-label="Tem gato">
            <input type="radio" name="tem_gato" id="tem_gato_sim" value="sim" required />
            <label for="tem_gato_sim">Sim</label>
            <input type="radio" name="tem_gato" id="tem_gato_nao" value="nao" />
            <label for="tem_gato_nao">Não</label>
          </div>
          <span class="error-msg" id="tem_gato-error"></span>
        </div>

        <div class="conditional" id="gato-detalhes">
          <div class="field">
            <span class="label-text">O gato tem mais de 1 ano?</span>
            <div class="choice-group" role="radiogroup" aria-label="Gato mais de 1 ano">
              <input type="radio" name="gato_mais_1_ano" id="gato_ano_sim" value="sim" />
              <label for="gato_ano_sim">Sim</label>
              <input type="radio" name="gato_mais_1_ano" id="gato_ano_nao" value="nao" />
              <label for="gato_ano_nao">Não</label>
            </div>
            <span class="error-msg" id="gato_mais_1_ano-error"></span>
          </div>

          <div class="field">
            <span class="label-text">O gato é castrado?</span>
            <div class="choice-group" role="radiogroup" aria-label="Gato castrado">
              <input type="radio" name="gato_castrado" id="gato_castrado_sim" value="sim" />
              <label for="gato_castrado_sim">Sim</label>
              <input type="radio" name="gato_castrado" id="gato_castrado_nao" value="nao" />
              <label for="gato_castrado_nao">Não</label>
            </div>
            <span class="error-msg" id="gato_castrado-error"></span>
          </div>
        </div>

        <p class="section-label">Ração</p>

        <div class="field">
          <span class="label-text">Seu pet come alguma marca específica de ração?</span>
          <div class="choice-group" role="radiogroup" aria-label="Marca específica de ração">
            <input type="radio" name="marca_racao_especifica" id="marca_racao_sim" value="sim" required />
            <label for="marca_racao_sim">Sim</label>
            <input type="radio" name="marca_racao_especifica" id="marca_racao_nao" value="nao" />
            <label for="marca_racao_nao">Não</label>
          </div>
          <span class="error-msg" id="marca_racao_especifica-error"></span>
        </div>

        <div class="conditional" id="marca-racao-detalhes">
          <div class="field">
            <label for="marca_racao">Qual marca de ração?</label>
            <input type="text" id="marca_racao" name="marca_racao" placeholder="Digite a marca" />
            <span class="error-msg" id="marca_racao-error"></span>
          </div>
        </div>

        <label class="consent">
          <input type="checkbox" id="consent" required />
          <span>Autorizo o uso dos meus dados para contato e atendimento pela PAPAPET Rações.</span>
        </label>

        <button type="submit" class="btn-submit" id="submit-btn">Enviar e ir para o WhatsApp</button>

        <div class="alert error" id="alert-error" role="alert"></div>
      </form>
    </section>

    <footer class="footer">PAPAPET Rações</footer>
  </main>

  <!-- ==================== JavaScript (interno) ==================== -->
  <script>
    const WEBHOOK_URL = "https://cloud.activepieces.com/api/v1/webhooks/2RRI7P2ydZifm1QUOsPm1";
    const WHATSAPP_URL = "https://wa.me/5567992531772";
    const CPF_STORAGE_KEY = "papapet_lead_cpfs";

    const form = document.getElementById("lead-form");
    const submitBtn = document.getElementById("submit-btn");
    const alertError = document.getElementById("alert-error");
    const cachorroDetalhes = document.getElementById("cachorro-detalhes");
    const gatoDetalhes = document.getElementById("gato-detalhes");

    const nomeInput = document.getElementById("nome");
    const cpfInput = document.getElementById("cpf");
    const whatsappInput = document.getElementById("whatsapp");
    const marcaRacaoInput = document.getElementById("marca_racao");

    function onlyDigits(value) {
      return value.replace(/\D/g, "");
    }

    function getRegisteredCpfs() {
      try {
        const raw = localStorage.getItem(CPF_STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch {
        return [];
      }
    }

    function registerCpf(cpfDigits) {
      const list = getRegisteredCpfs();
      if (!list.includes(cpfDigits)) {
        list.push(cpfDigits);
        localStorage.setItem(CPF_STORAGE_KEY, JSON.stringify(list));
      }
    }

    function isCpfAlreadyRegistered(cpfDigits) {
      return getRegisteredCpfs().includes(cpfDigits);
    }

    function isValidCpf(cpf) {
      const digits = onlyDigits(cpf);
      if (digits.length !== 11) return false;
      if (/^(\d)\1{10}$/.test(digits)) return false;

      let sum = 0;
      for (let i = 0; i < 9; i++) sum += parseInt(digits[i], 10) * (10 - i);
      let rest = (sum * 10) % 11;
      if (rest === 10 || rest === 11) rest = 0;
      if (rest !== parseInt(digits[9], 10)) return false;

      sum = 0;
      for (let i = 0; i < 10; i++) sum += parseInt(digits[i], 10) * (11 - i);
      rest = (sum * 10) % 11;
      if (rest === 10 || rest === 11) rest = 0;
      return rest === parseInt(digits[10], 10);
    }

    function isValidWhatsApp(digits) {
      return digits.length >= 10 && digits.length <= 11;
    }

    function maskCpf(value) {
      const d = onlyDigits(value).slice(0, 11);
      if (d.length <= 3) return d;
      if (d.length <= 6) return `${d.slice(0, 3)}.${d.slice(3)}`;
      if (d.length <= 9) return `${d.slice(0, 3)}.${d.slice(3, 6)}.${d.slice(6)}`;
      return `${d.slice(0, 3)}.${d.slice(3, 6)}.${d.slice(6, 9)}-${d.slice(9)}`;
    }

    function maskPhone(value) {
      const d = onlyDigits(value).slice(0, 11);
      if (d.length <= 2) return d.length ? `(${d}` : "";
      if (d.length <= 7) return `(${d.slice(0, 2)}) ${d.slice(2)}`;
      return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
    }

    function getRadio(name) {
      const el = form.querySelector(`input[name="${name}"]:checked`);
      return el ? el.value : null;
    }

    function clearRadioGroup(name) {
      form.querySelectorAll(`input[name="${name}"]`).forEach((r) => {
        r.checked = false;
      });
    }

    function showFieldError(fieldId, message) {
      const err = document.getElementById(`${fieldId}-error`);
      if (err) {
        err.textContent = message;
        err.classList.add("visible");
      }
      const input = document.getElementById(fieldId);
      if (input) input.classList.add("invalid");
    }

    function clearErrors() {
      form.querySelectorAll(".error-msg").forEach((el) => {
        el.textContent = "";
        el.classList.remove("visible");
      });
      form.querySelectorAll("input.invalid").forEach((el) => el.classList.remove("invalid"));
      alertError.classList.remove("visible");
    }

    function showGlobalError(message) {
      alertError.textContent = message;
      alertError.classList.add("visible");
    }

    function requireRadio(name, label) {
      const value = getRadio(name);
      if (!value) {
        showFieldError(name, `Selecione uma opção: ${label}.`);
        return null;
      }
      return value;
    }

    function toggleConditional(toggleName, panelId, detailNames) {
      const panel = document.getElementById(panelId);
      const hasPet = getRadio(toggleName) === "sim";

      if (hasPet) {
        panel.classList.add("visible");
      } else {
        panel.classList.remove("visible");
        detailNames.forEach(clearRadioGroup);
        detailNames.forEach((n) => {
          const err = document.getElementById(`${n}-error`);
          if (err) {
            err.textContent = "";
            err.classList.remove("visible");
          }
        });
      }
    }

    form.querySelectorAll('input[name="tem_cachorro"]').forEach((el) => {
      el.addEventListener("change", () => {
        toggleConditional("tem_cachorro", "cachorro-detalhes", [
          "cachorro_mais_1_ano",
          "cachorro_pequeno_porte",
        ]);
      });
    });

    form.querySelectorAll('input[name="tem_gato"]').forEach((el) => {
      el.addEventListener("change", () => {
        toggleConditional("tem_gato", "gato-detalhes", ["gato_mais_1_ano", "gato_castrado"]);
      });
    });

    form.querySelectorAll('input[name="marca_racao_especifica"]').forEach((el) => {
      el.addEventListener("change", () => {
        const panel = document.getElementById("marca-racao-detalhes");
        if (getRadio("marca_racao_especifica") === "sim") {
          panel.classList.add("visible");
        } else {
          panel.classList.remove("visible");
          marcaRacaoInput.value = "";
          marcaRacaoInput.classList.remove("invalid");
          const err = document.getElementById("marca_racao-error");
          err.textContent = "";
          err.classList.remove("visible");
        }
      });
    });

    cpfInput.addEventListener("input", (e) => {
      e.target.value = maskCpf(e.target.value);
    });

    whatsappInput.addEventListener("input", (e) => {
      e.target.value = maskPhone(e.target.value);
    });

    function validateForm() {
      clearErrors();
      let valid = true;

      const jaCliente = requireRadio("ja_cliente", "já é cliente");
      if (!jaCliente) valid = false;

      const nome = nomeInput.value.trim();
      if (nome.length < 3) {
        showFieldError("nome", "Informe seu nome completo.");
        valid = false;
      }

      const cpfDigits = onlyDigits(cpfInput.value);
      if (!isValidCpf(cpfDigits)) {
        showFieldError("cpf", "Informe um CPF válido.");
        valid = false;
      } else if (isCpfAlreadyRegistered(cpfDigits)) {
        showFieldError("cpf", "Este CPF já foi cadastrado. Não é possível cadastrar novamente.");
        valid = false;
      }

      const whatsappDigits = onlyDigits(whatsappInput.value);
      if (!isValidWhatsApp(whatsappDigits)) {
        showFieldError("whatsapp", "Informe um WhatsApp válido com DDD.");
        valid = false;
      }

      const temCachorro = requireRadio("tem_cachorro", "tem cachorro");
      if (!temCachorro) valid = false;

      let cachorroMais1Ano = null;
      let cachorroPequenoPorte = null;
      if (temCachorro === "sim") {
        cachorroMais1Ano = requireRadio("cachorro_mais_1_ano", "cachorro com mais de 1 ano");
        if (!cachorroMais1Ano) valid = false;
        cachorroPequenoPorte = requireRadio("cachorro_pequeno_porte", "porte do cachorro");
        if (!cachorroPequenoPorte) valid = false;
      }

      const temGato = requireRadio("tem_gato", "tem gato");
      if (!temGato) valid = false;

      let gatoMais1Ano = null;
      let gatoCastrado = null;
      if (temGato === "sim") {
        gatoMais1Ano = requireRadio("gato_mais_1_ano", "gato com mais de 1 ano");
        if (!gatoMais1Ano) valid = false;
        gatoCastrado = requireRadio("gato_castrado", "gato castrado");
        if (!gatoCastrado) valid = false;
      }

      const marcaRacaoEspecifica = requireRadio("marca_racao_especifica", "marca específica de ração");
      if (!marcaRacaoEspecifica) valid = false;

      let marcaRacao = null;
      if (marcaRacaoEspecifica === "sim") {
        marcaRacao = marcaRacaoInput.value.trim();
        if (marcaRacao.length < 2) {
          showFieldError("marca_racao", "Informe a marca de ração.");
          valid = false;
        }
      }

      const consent = document.getElementById("consent");
      if (!consent.checked) {
        showGlobalError("Aceite o uso dos dados para continuar.");
        valid = false;
      }

      if (!valid) return null;

      return {
        ja_cliente: jaCliente,
        nome,
        cpf: cpfDigits,
        whatsapp: whatsappDigits,
        tem_cachorro: temCachorro,
        cachorro_mais_1_ano: cachorroMais1Ano,
        cachorro_pequeno_porte: cachorroPequenoPorte,
        tem_gato: temGato,
        gato_mais_1_ano: gatoMais1Ano,
        gato_castrado: gatoCastrado,
        marca_racao_especifica: marcaRacaoEspecifica,
        marca_racao: marcaRacao,
      };
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearErrors();

      const data = validateForm();
      if (!data) return;

      submitBtn.disabled = true;
      submitBtn.textContent = "Enviando...";

      const payload = {
        ja_cliente: data.ja_cliente,
        nome: data.nome,
        cpf: data.cpf,
        cpf_formatado: maskCpf(data.cpf),
        whatsapp: data.whatsapp,
        whatsapp_formatado: maskPhone(data.whatsapp),
        tem_cachorro: data.tem_cachorro,
        cachorro_mais_1_ano: data.cachorro_mais_1_ano,
        cachorro_pequeno_porte: data.cachorro_pequeno_porte,
        tem_gato: data.tem_gato,
        gato_mais_1_ano: data.gato_mais_1_ano,
        gato_castrado: data.gato_castrado,
        marca_racao_especifica: data.marca_racao_especifica,
        marca_racao: data.marca_racao,
        origem: "landing-papapet-lead",
        data_cadastro: new Date().toISOString(),
      };

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (!response.ok) {
          throw new Error(`Erro ${response.status}`);
        }

        registerCpf(data.cpf);
        window.location.href = WHATSAPP_URL;
      } catch {
        showGlobalError(
          "Não foi possível enviar seu cadastro. Verifique sua conexão e tente novamente."
        );
        submitBtn.disabled = false;
        submitBtn.textContent = "Enviar e ir para o WhatsApp";
      }
    });
  </script>
</body>
</html>
